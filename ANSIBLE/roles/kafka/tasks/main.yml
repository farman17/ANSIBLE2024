- name: Pastikan Java (OpenJDK 17) terpasang
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: yes

- name: Buat group kafka
  ansible.builtin.group:
    name: "{{ kafka_group }}"
    state: present

- name: Buat user kafka
  ansible.builtin.user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    shell: /usr/sbin/nologin
    create_home: no
    system: yes

- name: Buat direktori
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0755"
  loop:
    - "{{ kafka_install_dir }}"
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"
    - "{{ kafka_config_dir }}"
    - "{{ kafka_data_dir }}/data"

- name: Unduh Kafka
  ansible.builtin.get_url:
    url: "{{ kafka_download_url }}"
    dest: "{{ kafka_archive_path }}"
    mode: "0644"
  register: dl
  until: dl is succeeded
  retries: 3
  delay: 5

- name: Ekstrak Kafka
  ansible.builtin.unarchive:
    src: "{{ kafka_archive_path }}"
    dest: "{{ kafka_install_dir }}"
    remote_src: yes
    creates: "{{ kafka_install_dir }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"

- name: Symlink current -> versi
  ansible.builtin.file:
    src: "{{ kafka_install_dir }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
    dest: "{{ kafka_install_dir }}/current"
    state: link
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Tetapkan node_id lokal jika belum ada
  ansible.builtin.set_fact:
    node_id: "{{ node_id | default(ansible_play_hosts.index(inventory_hostname) + 1) }}"

# Voters (dibangun sekali)
- name: Bangun daftar voters (list)
  ansible.builtin.set_fact:
    kafka_voters_list: "{{ (kafka_voters_list | default([])) + [
      (hostvars[item].node_id | default(idx + 1)) | string
      ~ '@' ~ (hostvars[item].kafka_advertised_listener_host
               | default(hostvars[item].ansible_host | default(item)))
      ~ ':' ~ kafka_controller_port | string
    ] }}"
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    index_var: idx
    label: "{{ item }}"
  run_once: true

- name: Gabungkan voters
  ansible.builtin.set_fact:
    kafka_voters: "{{ kafka_voters_list | unique | join(',') }}"
  run_once: true


# Cluster ID
- name: Generate cluster id jika kosong
  ansible.builtin.command: uuidgen
  register: uuid_out
  when: kafka_cluster_id | length == 0
  run_once: true
  changed_when: false

- name: Tetapkan cluster id final
  ansible.builtin.set_fact:
    kafka_cluster_id_final: "{{ (kafka_cluster_id | length > 0) | ternary(kafka_cluster_id, uuid_out.stdout) }}"
  run_once: true

- name: Sebarkan cluster id ke semua host
  ansible.builtin.copy:
    dest: "{{ kafka_cluster_id_file }}"
    content: "{{ hostvars[ansible_play_hosts[0]].kafka_cluster_id_final | default(kafka_cluster_id_final) }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0644"
  when: not (kafka_cluster_id_file is file)

# (pastikan sebelumnya kamu sudah set_fact node_id & build voters, lihat di bawah)

- name: Set advertised host fallback jika belum ada
  ansible.builtin.set_fact:
    kafka_advertised_listener_host: >-
      {{ kafka_advertised_listener_host
         | default(hostvars[inventory_hostname].kafka_advertised_listener_host
         | default(ansible_host
         | default(ansible_default_ipv4.address
         | default(inventory_hostname)))) }}

- name: Tulis server.properties
  ansible.builtin.copy:
    dest: "{{ kafka_config_dir }}/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0644"
    content: |
      # Generated by Ansible
      process.roles=broker,controller
      node.id={{ node_id }}
      controller.quorum.voters={{ hostvars[ansible_play_hosts[0]].kafka_voters | default(kafka_voters) }}

      listeners=PLAINTEXT://0.0.0.0:{{ kafka_port }},CONTROLLER://0.0.0.0:{{ kafka_controller_port }}
      advertised.listeners=PLAINTEXT://{{ kafka_advertised_listener_host }}:{{ kafka_port }}
      listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      inter.broker.listener.name=PLAINTEXT
      controller.listener.names=CONTROLLER

      num.network.threads=3
      num.io.threads=8
      socket.send.buffer.bytes=102400
      socket.receive.buffer.bytes=102400
      socket.request.max.bytes=104857600

      log.dirs={{ kafka_data_dir }}/data
      log.retention.hours=168
      log.segment.bytes=1073741824
      log.retention.check.interval.ms=300000

      num.partitions={{ kafka_num_partitions }}
      offsets.topic.replication.factor={{ kafka_offsets_rf }}
      transaction.state.log.replication.factor={{ kafka_txn_rf }}
      transaction.state.log.min.isr={{ kafka_min_isr }}
      group.initial.rebalance.delay.ms=0

      log4j.configuration=file:{{ kafka_config_dir }}/log4j.properties


- name: Tulis log4j.properties
  ansible.builtin.copy:
    dest: "{{ kafka_config_dir }}/log4j.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0644"
    content: |
      log4j.rootLogger=INFO, stdout, kafkaAppender
      log4j.appender.stdout=org.apache.log4j.ConsoleAppender
      log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
      log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
      log4j.appender.kafkaAppender=org.apache.log4j.RollingFileAppender
      log4j.appender.kafkaAppender.File={{ kafka_log_dir }}/server.log
      log4j.appender.kafkaAppender.MaxFileSize=256MB
      log4j.appender.kafkaAppender.MaxBackupIndex=3
      log4j.appender.kafkaAppender.layout=org.apache.log4j.PatternLayout
      log4j.appender.kafkaAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

- name: Pastikan paket ACL ada (untuk become ke non-root)
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: yes

- name: Format storage KRaft (idempotent)
  become_user: "{{ kafka_user }}"
  ansible.builtin.shell: >
    {{ kafka_install_dir }}/current/bin/kafka-storage.sh format
    -t $(cat {{ kafka_cluster_id_file }})
    -c {{ kafka_config_dir }}/server.properties
  args:
    creates: "{{ kafka_data_dir }}/meta.properties"

- name: Buat systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka (KRaft)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ kafka_user }}
      Group={{ kafka_group }}
      Environment="KAFKA_HEAP_OPTS={{ kafka_heap_opts }}"
      ExecStart={{ kafka_install_dir }}/current/bin/kafka-server-start.sh {{ kafka_config_dir }}/server.properties
      ExecStop=/bin/kill -TERM $MAINPID
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=200000
      WorkingDirectory={{ kafka_install_dir }}/current

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable & start Kafka
  ansible.builtin.systemd:
    name: kafka
    state: started
    enabled: yes

- name: Tunggu port broker ready
  ansible.builtin.wait_for:
    port: "{{ kafka_port }}"
    state: started
    timeout: 90
