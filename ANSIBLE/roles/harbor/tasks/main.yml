- name: Get latest Harbor version from GitHub API
  uri:
    url: https://api.github.com/repos/goharbor/harbor/releases/latest
    return_content: yes
  register: harbor_api_response
  when: harbor_version == 'latest'

- name: Set latest Harbor version from API
  set_fact:
    resolved_harbor_version: "{{ harbor_api_response.json.tag_name }}"
  when: harbor_version == 'latest'

- name: Set specific Harbor version (manual override)
  set_fact:
    resolved_harbor_version: "{{ harbor_version }}"
  when: harbor_version != 'latest'

- name: Download Harbor installer
  ansible.builtin.get_url:
    url: "https://github.com/goharbor/harbor/releases/download/{{ resolved_harbor_version }}/harbor-offline-installer-{{ resolved_harbor_version }}.tgz"
    dest: "{{ harbor_install_dir }}/harbor-installer.tgz"
    mode: '0644'

- name: Extract Harbor installer
  ansible.builtin.unarchive:
    src: "{{ harbor_install_dir }}/harbor-installer.tgz"
    dest: "{{ harbor_install_dir }}"
    remote_src: yes

- name: Copy Harbor config template
  ansible.builtin.copy:
    src: "{{ harbor_install_dir }}/harbor/harbor.yml.tmpl"
    dest: "{{ harbor_install_dir }}/harbor/harbor.yml"
    remote_src: yes

- name: Replace hostname in harbor.yml
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'hostname:.*'
    replace: "hostname: {{ hostname }}"

- name: Replace port in harbor.yml
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'port: 80'
    replace: "port: {{ port }}"

- name: Replace admin password in harbor.yml
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'harbor_admin_password:.*'
    replace: "harbor_admin_password: {{ pass_harbor }}"

- name: Disable https in harbor.yml
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: '^https:'
    replace: '#https:'

- name: Disable port 443
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'port: 443'
    replace: '#port: 443'

- name: Disable certificate path
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'certificate: /your/certificate/path'
    replace: '#certificate: /your/certificate/path'

- name: Disable private key path
  replace:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
    regexp: 'private_key: /your/private/key/path'
    replace: '#private_key: /your/private/key/path'

- name: Install Harbor
  command: ./install.sh
  args:
    chdir: "{{ harbor_install_dir }}/harbor"

- name: Cleanup installer
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ harbor_install_dir }}/harbor-installer.tgz"
    - "{{ harbor_install_dir }}/harbor/harbor.{{ resolved_harbor_version }}.tar.gz"

- name: Copy NGINX domain config
  copy:
    src: ../templates/domain
    dest: /etc/nginx/sites-enabled/{{ hostname }}

- name: Replace port in NGINX config
  replace:
    path: /etc/nginx/sites-enabled/{{ hostname }}
    regexp: '8080'
    replace: '{{ port }}'

- name: Replace domain in NGINX config
  replace:
    path: /etc/nginx/sites-enabled/{{ hostname }}
    regexp: 'domain'
    replace: '{{ hostname }}'

- name: Restart NGINX
  service:
    name: nginx
    state: restarted

- name: DONE
  debug:
    msg: "The latest Harbor Repository ({{ resolved_harbor_version }}) installed successfully!"
