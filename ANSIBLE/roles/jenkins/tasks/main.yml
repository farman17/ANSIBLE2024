    - name: Tentukan paket Java 17 sesuai OS family
      ansible.builtin.set_fact:
        java_pkg: "{{ java_pkg_map[ansible_facts['os_family']] | default('java-17-openjdk') }}"

    - name: Instal Java 17
      ansible.builtin.package:
        name: "{{ java_pkg }}"
        state: present

    - name: Buat group Jenkins
      ansible.builtin.group:
        name: "{{ jenkins_group }}"
        state: present

    - name: Buat user Jenkins
      ansible.builtin.user:
        name: "{{ jenkins_user }}"
        group: "{{ jenkins_group }}"
        home: "{{ jenkins_home }}"
        shell: /usr/sbin/nologin
        create_home: yes
        system: yes

    - name: Buat direktori JENKINS_HOME
      ansible.builtin.file:
        path: "{{ jenkins_home }}"
        state: directory
        owner: "{{ jenkins_user }}"
        group: "{{ jenkins_group }}"
        mode: "0755"

    - name: Buat direktori penyimpanan WAR
      ansible.builtin.file:
        path: "{{ jenkins_war_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: (Opsional) siapkan checksum prefix
      ansible.builtin.set_fact:
        jenkins_war_checksum_prefixed: "sha256:{{ jenkins_war_checksum }}"
      when: jenkins_war_checksum | default('') | length > 0

    - name: Unduh jenkins.war
      ansible.builtin.get_url:
        url: "{{ jenkins_war_url }}"
        dest: "{{ jenkins_war_path }}"
        mode: "0644"
        checksum: "{{ jenkins_war_checksum_prefixed | default(omit) }}"

    - name: Pasang unit file systemd untuk Jenkins
      ansible.builtin.template:
        src: "templates/jenkins.service.j2"
        dest: "/etc/systemd/system/jenkins.service"
        mode: "0644"
      notify:
        - reload systemd
        - restart jenkins

    - name: Enable & start service Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Tunggu port Jenkins ready
      ansible.builtin.wait_for:
        port: "{{ jenkins_port }}"
        delay: 2
        timeout: 300

    - name: Info lokasi initial admin password
      ansible.builtin.debug:
        msg: "Password awal ada di {{ jenkins_home }}/secrets/initialAdminPassword"

