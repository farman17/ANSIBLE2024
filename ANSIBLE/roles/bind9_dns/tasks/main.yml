
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install BIND9 packages
      apt:
        name: "{{ bind9_packages }}"
        state: present

    - name: Enable and start bind9 service
      systemd:
        name: bind9
        enabled: yes
        state: started

    - name: Deploy named.conf.options file
      copy:
        src: named.conf.options
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Deploy zone configuration file
      copy:
        src: named.conf.local
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Deploy example zone file
      copy:
        src: db.example.com
        dest: /etc/bind/db.example.com
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9
