- name: Update Repository cache
  become: yes
  become_user: root
  apt:
    update_cache: true

- name: Install apache2-utils (required for htpasswd)
  apt:
    name: apache2-utils
    state: present

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - wget
      - gnupg2
      - python3-passlib
    state: present
    update_cache: yes
