- name: Introductions
  ansible.builtin.debug:
    msg: "Installing and configuring Redis master."

- name: Add Redis PPA (optional – kalau mau pakai paket versi PPA)
  ansible.builtin.apt_repository:
    repo: ppa:redislabs/redis
    state: present

- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: yes

- name: Set tcp-keepalive to 60
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*tcp-keepalive\s+\d+'
    line: 'tcp-keepalive 60'
  notify: Restart redis

- name: Enable AOF persistence
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*appendonly\s+\w+'
    line: 'appendonly yes'
  notify: Restart redis

- name: Bind to loopback + master IP
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*bind\s+.*'
    line: 'bind 127.0.0.1 {{ ip_nodes_redis_master }}'
  notify: Restart redis

- name: Require password (master)
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*requirepass\s+.*'
    line: 'requirepass {{ pass_redis }}'
  notify: Restart redis

# --- Memory controls (atur sesuai kebutuhan) ---
- name: Set maxmemory size
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*maxmemory\s+.*'
    line: 'maxmemory {{ redis_maxmemory | default("512mb") }}'
  notify: Restart redis

- name: Set eviction policy
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*maxmemory-policy\s+.*'
    line: 'maxmemory-policy {{ redis_eviction_policy | default("allkeys-lru") }}'
  notify: Restart redis
# -----------------------------------------------

- name: Ensure redis is enabled and started
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: yes

- name: Show listening sockets
  ansible.builtin.command: ss -ltnp
  register: ss_out

- name: Debug sockets (filter redis)
  ansible.builtin.debug:
    msg: "{{ ss_out.stdout_lines | select('search', 'redis') | list }}"
