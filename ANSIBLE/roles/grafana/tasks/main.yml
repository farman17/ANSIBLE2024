# === Install Grafana ===
- name: Add Grafana GPG key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Add Grafana APT repository
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    filename: grafana

- name: Update APT cache
  apt:
    update_cache: yes

- name: Install Grafana
  apt:
    name: grafana
    state: present

- name: Enable and start Grafana service
  systemd:
    name: grafana-server
    enabled: yes
    state: started


# === Provision Dashboard Grafana ===
- name: Provision Prometheus datasource
  copy:
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: '0644'
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:9090
          isDefault: true
          jsonData:
            timeInterval: 15s
  notify: Restart grafana

- name: Ensure dashboards directory exists
  file:
    path: /var/lib/grafana/dashboards
    state: directory
    mode: '0755'

- name: Download Node Exporter Full (1860) dashboard
  get_url:
    url: https://grafana.com/api/dashboards/1860/revisions/latest/download
    dest: /var/lib/grafana/dashboards/node-exporter-full.json
    mode: '0644'

- name: Download Prometheus 2.0 Stats (3662) dashboard
  get_url:
    url: https://grafana.com/api/dashboards/3662/revisions/latest/download
    dest: /var/lib/grafana/dashboards/prometheus-2-stats.json
    mode: '0644'

- name: Map ${DS_PROMETHEUS} to "Prometheus" in dashboards
  replace:
    path: "{{ item }}"
    regexp: '\$\{DS_[A-Z0-9_]+\}'
    replace: 'Prometheus'
  loop:
    - /var/lib/grafana/dashboards/node-exporter-full.json
    - /var/lib/grafana/dashboards/prometheus-2-stats.json

# --- Task set default instance ---
- name: Set default instance in dashboard
  replace:
    path: /var/lib/grafana/dashboards/node-exporter-full.json
    regexp: '"current"\s*:\s*{[^}]*"text"\s*:\s*".*?",\s*"value"\s*:\s*".*?"}'
    replace: '"current": {"selected": true, "text": "{{ node_default_instance }}", "value": "{{ node_default_instance }}"}'
  notify: Restart grafana

- name: Provision dashboard provider
  copy:
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    mode: '0644'
    content: |
      apiVersion: 1
      providers:
        - name: 'Monitoring'
          orgId: 1
          folder: 'Monitoring'
          type: file
          disableDeletion: false
          editable: true
          allowUiUpdates: true
          updateIntervalSeconds: 10
          options:
            path: /var/lib/grafana/dashboards
  notify: Restart grafana
